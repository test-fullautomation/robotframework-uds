#
# RobotFramework_UDS - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-uds"
version = "0.1.17"
description = "Robot Framework keywords for UDS (Unified Diagnostic Services) communication"
authors = [
   {name = "Mai Minh Tri", email = "tri.maiMinh@vn.bosch.com"}
]
maintainers = [
   {name = "Mai Minh Tri", email = "tri.maiMinh@vn.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "robotframework",
   "udsoncan",
   "doipclient",
   "odxtools"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-uds"

[tool.setuptools]
packages = ["RobotFramework_UDS"]

[tool.setuptools.package-data]
RobotFramework_UDS = ["*.pdf"]
